<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Лизоньки ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000000;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ===== Звёздное небо (фон на всех экранах) ===== */
  #starfield {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  #loveCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  /* ===== Экраны ===== */
  .screen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
  }
  .screen.visible {
    opacity: 1;
    pointer-events: auto;
  }

  /* ===== Экран 1: вопрос ===== */
  #screen1 h1 {
    font-size: clamp(1.5rem, 4vw, 2.8rem);
    text-align: center;
    line-height: 1.3;
    padding: 0 20px;
    font-weight: 600;
  }
  #screen1 .input-wrap {
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  #screen1 input {
    padding: 14px 24px;
    border-radius: 10px;
    border: 1px solid rgb(255, 255, 255);
    background: rgba(0, 0, 0, 0.8);
    color: #fff;
    font-size: 1.4rem;
    width: 220px;
    text-align: center;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  #screen1 input:focus {
    border-color: rgba(79, 172, 254, 0.8);
    box-shadow: 0 0 20px rgba(79, 172, 254, 0.2);
  }
  #screen1 button {
    padding: 14px 40px;
    font-size: 1.25rem;
    background: linear-gradient(135deg, #ff0000, #000000);
    border: none;
    color: #fff;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 4px 20px rgba(129, 5, 5, 0.938);
    transition: transform 0.15s, box-shadow 0.3s;
  }
  #screen1 button:hover {
    transform: scale(1.04);
    box-shadow: 0 6px 30px rgba(79, 172, 254, 0.5);
  }
  #errorMsg {
    color: #ff6b6b;
    font-size: 1.1rem;
    margin-top: 4px;
    min-height: 1.4rem;
  }

  /* ===== Экран 2: переход ===== */
  #screen2 h1 {
    font-size: clamp(2rem, 6vw, 4rem);
    text-align: center;
    font-weight: 700;
  }

  /* ===== Экран 3: сердце (canvas) ===== */
  #screen3 { background: transparent; }
  #heartCanvas {
    display: block;
  }

  /* мобильные */
  @media (max-width: 600px) {
    #screen1 input { width: 180px; font-size: 1.2rem; }
    #screen1 button { font-size: 1.1rem; padding: 12px 30px; }
  }
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<canvas id="loveCanvas"></canvas>

<!-- Экран 1 -->
<div id="screen1" class="screen visible">
  <h1>Ты точно моя Лизонька?<br>Если это так, то напиши наше любимое число:</h1>
  <div class="input-wrap">
    <input type="text" id="secretInput" placeholder="..." autocomplete="off" inputmode="numeric">
    <button id="submitBtn">Подтвердить</button>
    <span id="errorMsg"></span>
  </div>
</div>

<!-- Экран 2 -->
<div id="screen2" class="screen">
  <h1>Родная, это для тебя❤️‍🔥</h1>
</div>

<!-- Экран 3 -->
<div id="screen3" class="screen">
  <canvas id="heartCanvas"></canvas>
</div>

<script>
// ============================================================
//  ЗВЁЗДНОЕ НЕБО (фон)
// ============================================================
const starCanvas = document.getElementById('starfield');
const starCtx = starCanvas.getContext('2d');
let stars = [];

function initStars() {
  starCanvas.width = window.innerWidth;
  starCanvas.height = window.innerHeight;
  stars = [];
  const count = Math.floor((starCanvas.width * starCanvas.height) / 2500);

  for (let i = 0; i < count; i++) {
    stars.push(makeStar(true));
  }
}

function makeStar(randomAge) {
  const angle = Math.random() * Math.PI * 2;
  const speed = 0.01 + Math.random() * 0.10;
  return {
    x: Math.random() * starCanvas.width,
    y: Math.random() * starCanvas.height,
    r: Math.random() * 0.8 + 0.2,           // крупные звёзды
    twinkle: Math.random() * Math.PI * 2,
    speed: 0.01 + Math.random() * 0.03,
    vx: Math.cos(angle) * speed,             // скорость по X
    vy: Math.sin(angle) * speed,             // скорость по Y
    age: randomAge ? Math.random() * 800 : 0,
    maxAge: 600 + Math.random() * 1200,
    hue: 200 + Math.random() * 60            // от голубого до белого
  };
}

function drawStars() {
  starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
  const t = performance.now() * 0.001;

  // обновляем звёзды
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.age++;

    // движение
    s.x += s.vx;
    s.y += s.vy;

    // wrap — если звезда улетела за край, возвращаем с другой стороны
    if (s.x < -10) s.x = starCanvas.width + 10;
    if (s.x > starCanvas.width + 10) s.x = -10;
    if (s.y < -10) s.y = starCanvas.height + 10;
    if (s.y > starCanvas.height + 10) s.y = -10;

    // удаляем старые
    if (s.age >= s.maxAge) {
      stars.splice(i, 1);
    }
  }

  // добавляем новые
  while (stars.length < Math.floor((starCanvas.width * starCanvas.height) / 2500)) {
    stars.push(makeStar(false));
  }

  // рисуем
  stars.forEach(s => {
    const fadeIn = Math.min(1, s.age / 80);
    const fadeOut = Math.min(1, (s.maxAge - s.age) / 80);
    const lifeAlpha = Math.min(fadeIn, fadeOut);

    const twinkleAlpha = 0.5 + 0.5 * Math.sin(t * s.speed * 50 + s.twinkle);
    const alpha = lifeAlpha * twinkleAlpha;

    // внешнее свечение
    starCtx.beginPath();
    starCtx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
    starCtx.fillStyle = `hsla(${s.hue}, 80%, 75%, ${alpha * 0.15})`;
    starCtx.fill();

    // среднее свечение
    starCtx.beginPath();
    starCtx.arc(s.x, s.y, s.r * 1.8, 0, Math.PI * 2);
    starCtx.fillStyle = `hsla(${s.hue}, 80%, 85%, ${alpha * 0.35})`;
    starCtx.fill();

    // ядро звезды
    starCtx.beginPath();
    starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    starCtx.fillStyle = `hsla(${s.hue}, 40%, 95%, ${alpha})`;
    starCtx.fill();
  });

  requestAnimationFrame(drawStars);
}

initStars();
drawStars();
window.addEventListener('resize', initStars);

// ============================================================
//  ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
// ============================================================
const screen1 = document.getElementById('screen1');
const screen2 = document.getElementById('screen2');
const screen3 = document.getElementById('screen3');
const secretInput = document.getElementById('secretInput');
const submitBtn = document.getElementById('submitBtn');
const errorMsg = document.getElementById('errorMsg');

let musicStarted = false;

submitBtn.addEventListener('click', handleSubmit);
secretInput.addEventListener('keypress', e => {
  if (e.key === 'Enter') handleSubmit();
});

function handleSubmit() {
  const val = secretInput.value.trim();
  if (val === '69') {
    if (!musicStarted) {
      startMusic();
      musicStarted = true;
    }
    screen1.classList.remove('visible');
    setTimeout(() => {
      screen2.classList.add('visible');
      setTimeout(() => {
        screen2.classList.remove('visible');
        setTimeout(() => {
          screen3.classList.add('visible');
          initHeart();
        }, 1000);
      }, 3000);
    }, 800);
  } else {
    errorMsg.textContent = 'Кажется, это не наше число… Попробуй ещё раз 🙈';
    secretInput.value = '';
    secretInput.focus();
  }
}

// ============================================================
//  ФОНОВАЯ МУЗЫКА (Web Audio API — без внешних файлов)
// ============================================================
// ============================================================
//  ФОНОВАЯ МУЗЫКА (простой способ)
// ============================================================
let audio = null;

function startMusic() {
    try {
        // Создаём элемент audio
        audio = new Audio('love_you.mp3');
        
        // Устанавливаем громкость
        audio.volume = 0.25; // можно изменить значение по вкусу
        
        audio.loop = true;

        // Добавляем обработчики событий
        audio.addEventListener('canplay', () => {
            audio.play();
        });
        
        audio.addEventListener('error', (error) => {
            console.error('Ошибка при загрузке аудио:', error);
        });
        
        // Воспроизводим музыку
        audio.play()
            .then(() => {
                console.log('Музыка успешно воспроизводится');
            })
            .catch(error => {
                console.error('Ошибка воспроизведения:', error);
                
                // Если первый способ не сработал, пробуем второй
                const fallbackAudio = new Audio('love_you.mp3');
                fallbackAudio.volume = 0.15;
                fallbackAudio.loop = true;
                fallbackAudio.play();
            });
    } catch (error) {
        console.error('Ошибка при инициализации аудио:', error);
    }
}



// ============================================================
//  АНИМАЦИЯ СЕРДЦА
// ============================================================
function initHeart() {
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');

  let WIDTH, HEIGHT, SCALE;

  function resize() {
    WIDTH = window.innerWidth;
    HEIGHT = window.innerHeight;
    canvas.width = WIDTH;
    canvas.height = HEIGHT;
    // масштаб: сердце занимает ~80% высоты экрана
    SCALE = Math.min(WIDTH / 42, HEIGHT / 34);
  }
  resize();

  const WORDS = ["love you.", "Love You.", "LOVE YOU."];
  const CENTER_TEXT = "Happy birthday, my love💋";
  const COLORS = [
  'rgb(220, 20, 60)',   
  'rgb(139, 0, 0)',   
  'rgb(128, 0, 0)',   
  'rgb(178, 34, 34)'   
];

  class Particle {
    constructor(x, y, order, kind) {
      this.x = x;
      this.y = y;
      this.order = order;
      this.kind = kind;
      this.word = WORDS[Math.floor(Math.random() * WORDS.length)];
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.alpha = 0;
      this.flicker = Math.random() * Math.PI * 2;
      this.delay = 0;
      this.sizeMult = 0.85 + Math.random() * 0.3;
    }
  }

  function heartXY(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x, y: -y };
  }

  function toScreen(x, y) {
    return {
      x: x * SCALE + WIDTH / 2,
      y: y * SCALE + HEIGHT / 2
    };
  }

  function buildOutline(n, minGap) {
    const particles = [];
    const placed = [];
    for (let i = 0; i < n; i++) {
      const t = (i / n) * Math.PI * 2;
      const { x: bx, y: by } = heartXY(t);
      const { x: sx, y: sy } = toScreen(bx, by);
      if (placed.some(p => Math.hypot(sx - p.x, sy - p.y) < minGap)) continue;
      placed.push({ x: sx, y: sy });
      particles.push(new Particle(sx, sy, i, 'outline'));
    }
    return particles;
  }

  function buildFill(n, minGap) {
    const particles = [];
    const placed = [];
    let attempts = 0;
    const maxAttempts = n * 80;
    while (particles.length < n && attempts < maxAttempts) {
      attempts++;
      const t = Math.random() * Math.PI * 2;
      const r = Math.random() * 0.86;
      const { x: bx, y: by } = heartXY(t);
      const { x: sx, y: sy } = toScreen(bx * r, by * r);
      if (placed.some(p => Math.hypot(sx - p.x, sy - p.y) < minGap)) continue;
      placed.push({ x: sx, y: sy });
      particles.push(new Particle(sx, sy, Math.floor(Math.random() * 320), 'fill'));
    }
    return particles;
  }

  let outline, fill, particles, frame, fillStartFrame, centerStart;

  function setup() {
    resize();
    outline = buildOutline(160, 30);
    fill = buildFill(130, 46);

    const outlineSpan = outline.length ? Math.max(...outline.map(p => p.order)) : 0;
    const framesPerStep = 1.6;
    fillStartFrame = Math.floor(outlineSpan * framesPerStep) + 30;
    centerStart = fillStartFrame + 200;

    fill.forEach(p => p.delay = fillStartFrame + p.order);
    outline.forEach(p => p.delay = Math.floor(p.order * framesPerStep));

    particles = [...outline, ...fill];
    frame = 0;
  }

  setup();

  function drawGlowText(word, color, x, y, alpha, sizeMult) {
    if (alpha <= 0) return;

    const fontSize = Math.floor((sizeMult || 1) * 18);
    ctx.font = `bold ${fontSize}px Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (alpha > 10) {
      // большой glow
      ctx.shadowColor = color;
      ctx.shadowBlur = 45;
      ctx.globalAlpha = Math.max(0, (alpha / 255) / 7);
      ctx.fillStyle = color;
      ctx.fillText(word, x, y);

      // средний glow
      ctx.shadowBlur = 30;
      ctx.globalAlpha = Math.max(0, (alpha / 255) / 3);
      ctx.fillText(word, x, y);
    }

    // сам текст
    ctx.shadowBlur = 10;
    ctx.globalAlpha = alpha / 255;
    ctx.fillStyle = color;
    ctx.fillText(word, x, y);
  }

  function animate() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);
    frame++;

    // частицы сердца
    for (const p of particles) {
      if (frame > p.delay && p.alpha < 255) {
        p.alpha = Math.min(255, p.alpha + 14 + Math.floor(Math.random() * 5));
      }

      const flick = p.alpha >= 255
        ? 0.75 + 0.25 * Math.sin(frame * 0.04 + p.flicker)
        : 1.0;

      const alpha = Math.floor(p.alpha * flick);
      drawGlowText(p.word, p.color, p.x, p.y, alpha, p.sizeMult);
    }

    // центральная надпись
    if (frame > centerStart) {
      const progress = Math.min(1.0, (frame - centerStart) / 60);
      const centerAlpha = 255 * (1 - Math.exp(-progress * 8));
      const pulse = 1.0 + 0.025 * Math.sin(frame * 0.05);
      const fontSize = Math.floor(56 * pulse);

      ctx.font = `bold ${fontSize}px Georgia, serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // glow
      if (centerAlpha > 10) {
        ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
        ctx.shadowBlur = 40;
        ctx.globalAlpha = centerAlpha / 255 / 5;
        ctx.fillStyle = '#fffaf5';
        ctx.fillText(CENTER_TEXT, WIDTH / 2, HEIGHT / 2);

        ctx.shadowBlur = 15;
        ctx.globalAlpha = centerAlpha / 255 / 3;
        ctx.fillText(CENTER_TEXT, WIDTH / 2, HEIGHT / 2);
      }

      // текст
      ctx.shadowBlur = 0;
      ctx.globalAlpha = centerAlpha / 255;
      ctx.fillStyle = '#c71585';
      ctx.fillText(CENTER_TEXT, WIDTH / 2, HEIGHT / 2);
    }

    requestAnimationFrame(animate);
  }

  animate();

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      setup();
    }, 200);
  });
}
</script>
</body>
</html>
